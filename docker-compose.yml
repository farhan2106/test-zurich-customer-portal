services:
  postgres:
    image: postgres:16-alpine
    container_name: zurich_postgres
    environment:
      POSTGRES_USER: zurich
      POSTGRES_PASSWORD: zurich_pass
      POSTGRES_DB: CUSTOMER_BILLING_PORTAL
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zurich -d CUSTOMER_BILLING_PORTAL"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
